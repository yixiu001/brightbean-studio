{% load i18n %}
<div class="mt-3 p-3 rounded border border-red-200 bg-red-50 text-xs text-red-800">
  <div class="font-semibold mb-1">{% blocktranslate %}Couldn't complete the request{% endblocktranslate %}</div>
  <div>{{ message|default:"Please try again." }}</div>
  {% if code %}<div class="mt-1 text-red-600 font-mono">{% blocktranslate %}code: {{ code }}{% endblocktranslate %}</div>{% endif %}
</div>
